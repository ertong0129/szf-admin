<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>明朝传奇 · 游戏</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div id="app" class="game-app">
    <section id="create-screen" class="screen">
      <div class="create-wrap">
        <img class="create-logo" src="assets/official/ui/logo.png" alt="明朝传奇" />
        <h2>创建角色</h2>
        <div class="class-grid" id="class-grid"></div>
        <div class="name-row">
          <label>名号</label>
          <input id="name-input" maxlength="8" placeholder="少侠之名" />
        </div>
        <p id="class-tip" class="disclaimer"></p>
        <div class="nation-pick" id="nation-pick">
          <button type="button" class="selected" data-nation="ming">大明</button>
          <button type="button" data-nation="yuan">北元</button>
        </div>
        <div class="btn-row">
          <a class="btn ghost" href="index.html">返 回 选 服</a>
          <button class="btn" id="btn-enter">进入游戏</button>
        </div>
      </div>
    </section>

    <section id="play-screen" class="screen">
      <div class="stage-frame">
        <div class="stage">
          <canvas id="world"></canvas>
          <canvas id="world3d"></canvas>
          <div class="hud-top">
            <div class="portrait" id="portrait">武</div>
            <div class="bars">
              <div class="who" id="who-line">—</div>
              <div class="bar hp"><i id="hp-fill"></i><span id="hp-text"></span></div>
              <div class="bar mp"><i id="mp-fill"></i><span id="mp-text"></span></div>
              <button type="button" id="pk-mode" class="pk-mode" title="切换 PK 模式">和平</button>
              <div id="energy-line">精力 4000/4000</div>
              <div id="online-line">在线 —</div>
            </div>
          </div>
          <div id="target-frame" hidden>
            <div id="target-name">—</div>
            <div class="bar hp target-hp"><i id="target-hp"></i><span id="target-hp-text"></span></div>
          </div>
          <div class="side-right">
            <div class="minimap-wrap">
              <canvas id="minimap" width="196" height="132"></canvas>
              <div class="map-name">
                <span id="map-name">太平村</span>
                <span id="map-coord">24,17</span>
              </div>
              <div class="map-tools">
                <button type="button" id="btn-region-map" title="区域地图（M）">区域</button>
                <button type="button" id="btn-world-map" title="世界地图跳转">地图</button>
              </div>
            </div>
            <div class="quest-box">
              <h4>任务追踪 <span class="quest-hint">点绿名自动寻路</span></h4>
              <div id="quest-track"></div>
            </div>
          </div>
          <div class="chat-box">
            <div class="chat-tabs">
              <span class="on" data-chan="near">附近</span>
              <span data-chan="world">世界</span>
              <span data-chan="party">队伍</span>
              <span data-chan="clan">宗族</span>
            </div>
            <div class="chat-log" id="chat-log"></div>
            <form id="chat-form">
              <input id="chat-input" maxlength="80" placeholder="回车发言　/账号 密聊" autocomplete="off" />
              <button type="submit">发送</button>
            </form>
          </div>
          <div class="sys-btns">
            <button data-panel="char">角色</button>
            <button data-panel="bag">背包</button>
            <button data-panel="skills">技能</button>
            <button data-panel="pet">宠物</button>
            <button data-panel="forge">天工炉</button>
            <button data-panel="quest">任务</button>
            <button data-panel="social">社交</button>
            <button id="btn-auto">挂机</button>
            <button data-panel="help">系统</button>
            <button id="btn-save">存档</button>
            <a href="index.html">选服</a>
          </div>
          <div class="toast" id="toast"></div>
          <div class="dialog" id="dialog"></div>
          <div id="instance-hud" hidden>
            <div id="instance-title">副本</div>
            <div id="instance-info">—</div>
            <button type="button" id="btn-leave-instance">离开副本</button>
          </div>
          <div id="floor-clear" hidden>
            <div class="floor-box">
              <h3>本关挑战成功</h3>
              <p id="floor-clear-text"></p>
              <div class="btn-row">
                <button type="button" class="btn" data-floor="continue">继续挑战</button>
                <button type="button" class="btn ghost" data-floor="rest">休息一下</button>
                <button type="button" class="btn ghost" data-floor="leave">离开副本</button>
              </div>
            </div>
          </div>
        </div>
        <div class="dock">
          <div class="skill-bar" id="skill-bar"></div>
          <div class="dock-xp bar xp"><i id="xp-fill"></i><span id="xp-text"></span></div>
          <button type="button" id="btn-shop" class="shop-btn" title="商城">商</button>
        </div>
      </div>

      <div class="panel" id="panel-char"></div>
      <div class="panel" id="panel-bag"></div>
      <div class="panel" id="panel-skills"></div>
      <div class="panel" id="panel-pet"></div>
      <div class="panel" id="panel-forge"></div>
      <div class="panel" id="panel-quest"></div>
      <div class="panel" id="panel-help"></div>
      <div class="panel" id="panel-shop"></div>
      <div class="panel" id="panel-warehouse"></div>
      <div class="panel" id="panel-social"></div>
      <div class="panel" id="panel-trade"></div>
      <div id="map-overlay" hidden>
        <div class="map-win">
          <div class="map-tabs">
            <button type="button" data-map-tab="region" class="on">区域地图</button>
            <button type="button" data-map-tab="world">世界地图</button>
            <span id="map-overlay-title">太平村</span>
            <button type="button" class="close" data-close-map="1">×</button>
          </div>
          <div id="map-region" class="map-pane">
            <canvas id="region-canvas" width="640" height="420"></canvas>
            <div class="map-side">
              <h5>人物 / 传送</h5>
              <div id="map-npc-list"></div>
              <form id="map-coord-form">
                <input id="map-cx" maxlength="4" placeholder="X" />
                <input id="map-cy" maxlength="4" placeholder="Y" />
                <button type="submit">寻路</button>
              </form>
              <p class="map-tip">点地图或人名自动寻路。深蓝自己、黄 NPC、淡蓝出口。M 开关。</p>
            </div>
          </div>
          <div id="map-world" class="map-pane" hidden>
            <div class="world-bg" id="world-bg">
              <img src="assets/ingame/map/world.jpg" alt="世界地图" />
              <div id="world-pins"></div>
            </div>
            <p class="map-tip">点击地名自动寻路；背包有传送卷则瞬移。对照 91wan 地图资料。</p>
          </div>
        </div>
      </div>
      <div id="log-list" hidden></div>

      <div class="death-mask" id="death">
        <div>
          <h2 id="death-title">身死道消</h2>
          <p id="death-text">银两略有折损，将在太平村回魂。</p>
          <div class="btn-row" style="margin-top:16px">
            <button class="btn" id="btn-revive">回 村 再 战</button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="js/formulas.js"></script>
  <script src="js/data.js"></script>
  <script src="js/vendor/three.min.js"></script>
  <script src="js/art.js"></script>
  <script src="js/world3d.js"></script>
  <script src="js/path.js"></script>
  <script src="js/api.js"></script>
  <script src="js/core.js"></script>
  <script src="js/player.js"></script>
  <script src="js/world.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/quest.js"></script>
  <script src="js/dungeon.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/netplay.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/input.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
