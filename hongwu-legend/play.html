<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大明传说 · 游戏</title>
  <link rel="stylesheet" href="css/game.css" />
</head>
<body>
  <div id="app" class="game-app">
    <section id="create-screen" class="screen">
      <div class="create-wrap">
        <img class="create-logo" src="assets/official/ui/logo.png" alt="大明传说" />
        <h2>创建角色</h2>
        <div class="class-grid" id="class-grid"></div>
        <div class="name-row">
          <label>名号</label>
          <input id="name-input" maxlength="8" placeholder="少侠之名" />
        </div>
        <p id="class-tip" class="disclaimer"></p>
        <div class="nation-pick" id="nation-pick">
          <button type="button" class="selected" data-nation="ming">大明</button>
          <button type="button" data-nation="yuan">北元</button>
        </div>
        <div class="btn-row">
          <a class="btn ghost" href="index.html">返 回 选 服</a>
          <button class="btn" id="btn-enter">进入游戏</button>
        </div>
      </div>
    </section>

    <section id="play-screen" class="screen">
      <div class="stage-frame">
        <div class="stage">
          <canvas id="world"></canvas>
          <canvas id="world3d"></canvas>
          <div class="hud-top">
            <div class="hud-frame">
              <div class="portrait" id="portrait">武</div>
              <div class="hud-lv" id="hud-lv">1</div>
              <div class="who" id="who-line">—</div>
              <div class="hud-bars">
                <div class="bar hp"><i id="hp-fill"></i><span id="hp-text"></span></div>
                <div class="bar mp"><i id="mp-fill"></i><span id="mp-text"></span></div>
              </div>
            </div>
            <div class="hud-pet" id="hud-pet" hidden>
              <div class="pet-portrait" id="pet-portrait"></div>
              <div class="pet-lv" id="pet-lv">1</div>
              <div class="pet-who" id="pet-name">灵宠</div>
              <div class="bar hp pet-hp"><i id="pet-hp-fill"></i><span id="pet-hp-text"></span></div>
            </div>
            <div class="hud-buffs" id="hud-buffs"></div>
            <div class="hud-wallet">
              <button type="button" id="pk-mode" class="pk-mode" title="切换 PK 模式">和平</button>
              <span id="energy-line">精力 4000/4000</span>
              <span id="gold-line">元宝 0</span>
              <span id="silver-line">银两 0</span>
              <span id="online-line">在线 —</span>
            </div>
          </div>
          <div class="hud-acts" id="hud-acts">
            <button type="button" data-panel="shop" title="藏宝阁"><img src="assets/ingame/viewui/act-box.png" alt="藏宝阁" /></button>
            <button type="button" data-panel="help" title="天星罗盘"><img src="assets/ingame/viewui/compass-start.jpg" alt="罗盘" /></button>
            <button type="button" data-panel="quest" title="运镖"><img src="assets/ingame/viewui/act-biao.png" alt="运镖" /></button>
            <button type="button" data-panel="daily" title="缤纷活动"><img src="assets/ingame/viewui/act-gift.png" alt="活动" /></button>
            <button type="button" data-panel="vip" title="每日累充"><img src="assets/ingame/viewui/act-recharge.png" alt="累充" /></button>
            <button type="button" data-panel="achieve" title="传奇图鉴"><img src="assets/ingame/title/goal.png" alt="图鉴" /></button>
            <button type="button" data-panel="rank" title="封神台"><img src="assets/ingame/title/rank.png" alt="封神" /></button>
            <button type="button" data-act="pagoda" title="开封铁塔"><img src="assets/ingame/viewui/act-chest.png" alt="铁塔" /></button>
            <button type="button" data-act="tower" title="天下英雄"><img src="assets/ingame/viewui/act-biao-gold.png" alt="英雄" /></button>
          </div>
          <div id="auto-banner" hidden title="自动打怪中"></div>
          <div id="target-frame" hidden>
            <div id="target-name">—</div>
            <div class="bar hp target-hp"><i id="target-hp"></i><span id="target-hp-text"></span></div>
          </div>
          <div class="side-right">
            <div class="minimap-wrap">
              <canvas id="minimap" width="168" height="168"></canvas>
              <div class="minimap-ring"></div>
              <div class="map-name">
                <span id="map-name">太平村</span>
                <span id="map-coord">24,17</span>
              </div>
              <div class="map-tools">
                <button type="button" data-panel="vip" title="充值">充值</button>
                <button type="button" data-panel="rank" title="排行">排行</button>
                <button type="button" id="btn-auto-mini" title="挂机">挂机</button>
                <button type="button" id="btn-world-map" title="世界地图">地图</button>
              </div>
              <button type="button" id="btn-region-map" class="map-region-btn" title="区域地图（M）">区域</button>
            </div>
            <div class="quest-box" data-qtab="all">
              <div class="quest-tabs">
                <span class="on" data-qtab="all">全部</span>
                <span data-qtab="now">当前任务</span>
                <span data-qtab="act">当前活动</span>
              </div>
              <div id="quest-track"></div>
            </div>
          </div>
          <div class="chat-box">
            <div class="chat-tabs">
              <span data-chan="world">世界</span>
              <span data-chan="nation">国家</span>
              <span data-chan="clan">宗族</span>
              <span data-chan="party">队伍</span>
              <span class="on" data-chan="near">附近</span>
              <span data-chan="horn">喇叭</span>
              <span data-chan="whisper">私聊</span>
            </div>
            <div class="chat-log" id="chat-log"></div>
            <div class="chat-faces" id="chat-faces"></div>
            <form id="chat-form">
              <input id="chat-input" maxlength="80" placeholder="回车发言　/账号 密聊" autocomplete="off" />
              <button type="submit">发送</button>
            </form>
          </div>
          <div class="toast" id="toast"></div>
          <div class="dialog" id="dialog"></div>
          <div id="instance-hud" hidden>
            <div id="instance-title">副本</div>
            <div id="instance-info">—</div>
            <button type="button" id="btn-leave-instance">离开副本</button>
          </div>
          <div id="floor-clear" hidden>
            <div class="floor-box">
              <h3>本关挑战成功</h3>
              <p id="floor-clear-text"></p>
              <div class="btn-row">
                <button type="button" class="btn" data-floor="continue">继续挑战</button>
                <button type="button" class="btn ghost" data-floor="rest">休息一下</button>
                <button type="button" class="btn ghost" data-floor="leave">离开副本</button>
              </div>
            </div>
          </div>
        </div>
        <div class="dock">
          <div class="skill-bar" id="skill-bar"></div>
          <div class="dock-quick">
            <button type="button" id="btn-auto" title="自动打怪">猎</button>
            <button type="button" id="btn-mount" title="骑乘">驭</button>
            <button type="button" id="btn-world-quick" title="世界地图">拓</button>
            <button type="button" data-panel="forge" title="强化">强</button>
          </div>
          <div class="dock-utils">
            <button type="button" id="btn-sit" title="打坐（D）">坐</button>
            <button type="button" id="btn-auto-2" title="挂机（Z）">挂</button>
            <button type="button" id="btn-mount-2" title="坐骑">骑</button>
          </div>
          <nav class="dock-menu sys-btns">
            <button type="button" data-panel="char" title="角色"><img src="assets/ingame/viewui/menu-role.png" alt="角色" /></button>
            <button type="button" data-panel="skills" title="技能" class="dock-txt">技能</button>
            <button type="button" data-panel="bag" title="背包"><img src="assets/ingame/viewui/menu-bag.png" alt="背包" /></button>
            <button type="button" data-panel="pet" title="宠物"><img src="assets/ingame/viewui/menu-pet.png" alt="宠物" /></button>
            <button type="button" data-panel="char" data-char-open="mount" title="坐骑"><img src="assets/ingame/viewui/menu-mount.png" alt="坐骑" /></button>
            <button type="button" data-panel="social" title="好友"><img src="assets/ingame/viewui/menu-friends.png" alt="好友" /></button>
            <button type="button" data-panel="social" title="社会"><img src="assets/ingame/viewui/menu-social.png" alt="社会" /></button>
            <button type="button" data-panel="forge" title="天工炉"><img src="assets/ingame/viewui/menu-forge.png" alt="天工炉" /></button>
            <button type="button" data-panel="shop" title="市场"><img src="assets/ingame/viewui/menu-market.png" alt="市场" /></button>
            <button type="button" data-panel="mail" title="信件" class="dock-txt">信件</button>
            <button type="button" data-panel="quest" title="任务" class="dock-txt">任务</button>
            <button type="button" data-panel="help" title="系统" class="dock-txt">系统</button>
            <button type="button" id="btn-save" class="dock-txt">存档</button>
            <a href="index.html" class="dock-txt">选服</a>
          </nav>
          <div class="dock-xp bar xp"><i id="xp-fill"></i><span id="xp-text"></span></div>
          <button type="button" id="btn-shop" class="shop-btn" title="商城">商</button>
        </div>
      </div>

      <div class="panel" id="panel-char"></div>
      <div class="panel" id="panel-bag"></div>
      <div class="panel" id="panel-skills"></div>
      <div class="panel" id="panel-pet"></div>
      <div class="panel" id="panel-forge"></div>
      <div class="panel" id="panel-quest"></div>
      <div class="panel" id="panel-help"></div>
      <div class="panel" id="panel-shop"></div>
      <div class="panel" id="panel-warehouse"></div>
      <div class="panel" id="panel-social"></div>
      <div class="panel" id="panel-mail"></div>
      <div class="panel" id="panel-achieve"></div>
      <div class="panel" id="panel-rank"></div>
      <div class="panel" id="panel-daily"></div>
      <div class="panel" id="panel-vip"></div>
      <div class="panel" id="panel-trade"></div>
      <div id="map-overlay" hidden>
        <div class="map-win">
          <div class="map-tabs">
            <button type="button" data-map-tab="region" class="on">区域地图</button>
            <button type="button" data-map-tab="world">世界地图</button>
            <span id="map-overlay-title">太平村</span>
            <button type="button" class="close" data-close-map="1">×</button>
          </div>
          <div id="map-region" class="map-pane">
            <canvas id="region-canvas" width="640" height="420"></canvas>
            <div class="map-side">
              <h5>人物 / 传送</h5>
              <div id="map-npc-list"></div>
              <form id="map-coord-form">
                <input id="map-cx" maxlength="4" placeholder="X" />
                <input id="map-cy" maxlength="4" placeholder="Y" />
                <button type="submit">寻路</button>
              </form>
              <p class="map-tip">点地图或人名自动寻路。深蓝自己、黄 NPC、淡蓝出口。M 开关。</p>
            </div>
          </div>
          <div id="map-world" class="map-pane" hidden>
            <div class="world-bg" id="world-bg">
              <img src="assets/ingame/map/world.jpg" alt="世界地图" />
              <div id="world-pins"></div>
            </div>
            <p class="map-tip">点击地名自动寻路；背包有传送卷则瞬移。对照 91wan 地图资料。</p>
          </div>
        </div>
      </div>
      <div id="log-list" hidden></div>

      <div class="death-mask" id="death">
        <div>
          <h2 id="death-title">身死道消</h2>
          <p id="death-text">银两略有折损，将在太平村回魂。</p>
          <div class="btn-row" style="margin-top:16px">
            <button class="btn" id="btn-revive">回 村 再 战</button>
            <button class="btn ghost" id="btn-revive-here" hidden>原地健康复活</button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="js/formulas.js"></script>
  <script src="js/data.js"></script>
  <script src="js/bosses.js"></script>
  <script src="js/vendor/three.min.js"></script>
  <script src="js/ground.js"></script>
  <script src="js/art.js"></script>
  <script src="js/world3d.js"></script>
  <script src="js/path.js"></script>
  <script src="js/api.js"></script>
  <script src="js/core.js"></script>
  <script src="js/player.js"></script>
  <script src="js/world.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/quest.js"></script>
  <script src="js/dungeon.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/netplay.js"></script>
  <script src="js/life.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/input.js"></script>
  <script src="js/boot.js"></script>
</body>
</html>
